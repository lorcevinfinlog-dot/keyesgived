<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misty Dany — Ключ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at top, #0a1222, #020816);
    color: #e6f0ff; font-family: -apple-system, Segoe UI, Roboto, monospace;
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 20px;
  }
  .card {
    background: #0c1a34; border: 2px solid #00beff; border-radius: 18px;
    padding: 40px 30px; max-width: 460px; width: 100%;
    text-align: center; box-shadow: 0 0 40px rgba(0,190,255,.35);
  }
  h1 {
    font-size: 24px; margin-bottom: 8px;
    background: linear-gradient(90deg, #bee6ff, #00beff, #4670ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { color: #78aad2; font-size: 13px; margin-bottom: 28px; }
  .key {
    background: #0a2038; border: 1px dashed #00beff;
    border-radius: 12px; padding: 20px; margin: 20px 0;
    font-size: 22px; font-family: 'Courier New', monospace;
    color: #00beff; letter-spacing: 2px; font-weight: 700;
    user-select: all; word-break: break-all;
  }
  button {
    background: #00beff; color: #001020; border: none;
    padding: 12px 28px; border-radius: 10px; font-weight: 700;
    font-size: 14px; cursor: pointer; transition: .2s;
  }
  button:hover { background: #78dcff; transform: translateY(-1px); }
  button.copied { background: #3cf0a0; }
  .footer { color: #5078a8; font-size: 11px; margin-top: 24px; }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Misty Dany</h1>
  <p class="sub">Твой ключ на сегодня (UTC)</p>
  <div class="key" id="key">MISTY-EE9B685F</div>
  <button id="copy" onclick="copyKey()">📋 Скопировать</button>
  <p class="footer">Ключ меняется автоматически. Не делись им с другими.</p>
</div>
<script>
  function copyKey() {
    const text = document.getElementById('key').innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy');
      btn.innerText = '✓ Скопировано';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerText = '📋 Скопировать';
        btn.classList.remove('copied');
      }, 2000);
    });
  }
</script>
</body>
</html>

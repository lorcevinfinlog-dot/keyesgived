<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misty Dany — Ключ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: radial-gradient(circle at top, #0a1222, #020816);
    color: #e6f0ff; font-family: -apple-system, Segoe UI, Roboto, monospace;
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 20px;
  }
  .card {
    background: #0c1a34; border: 2px solid #00beff; border-radius: 18px;
    padding: 40px 30px; max-width: 460px; width: 100%;
    text-align: center; box-shadow: 0 0 40px rgba(0,190,255,.35);
  }
  h1 {
    font-size: 24px; margin-bottom: 8px;
    background: linear-gradient(90deg, #bee6ff, #00beff, #4670ff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { color: #78aad2; font-size: 13px; margin-bottom: 28px; }
  .key {
    background: #0a2038; border: 1px dashed #00beff;
    border-radius: 12px; padding: 20px; margin: 20px 0;
    font-size: 22px; font-family: 'Courier New', monospace;
    color: #00beff; letter-spacing: 2px; font-weight: 700;
    user-select: all; word-break: break-all;
  }
  button {
    background: #00beff; color: #001020; border: none;
    padding: 12px 28px; border-radius: 10px; font-weight: 700;
    font-size: 14px; cursor: pointer; transition: .2s;
  }
  button:hover { background: #78dcff; transform: translateY(-1px); }
  button.copied { background: #3cf0a0; }
  .footer { color: #5078a8; font-size: 11px; margin-top: 24px; }
  
  /* Стили для экрана блокировки */
  .lock-screen { display: none; flex-direction: column; align-items: center; gap: 15px; }
  .lock-icon { font-size: 40px; }
  .btn-lootlabs { background: #ff506e; color: white; text-decoration: none; padding: 12px 24px; border-radius: 10px; font-weight: bold; font-size: 14px; display: inline-block; transition: .2s; }
  .btn-lootlabs:hover { background: #ff2a4f; transform: translateY(-1px); }
</style>
</head>
<body>
<div class="card">
  <h1>🔐 Misty Dany</h1>
  
  <!-- Экран с ключом -->
  <div id="key-screen" style="display: none;">
    <p class="sub">Твой ключ на сегодня (UTC)</p>
    <div class="key" id="key">MISTY-6OW5-D4R8-50V7</div>
    <button id="copy" onclick="copyKey()">📋 Скопировать</button>
  </div>

  <!-- Экран блокировки (если зашли напрямую) -->
  <div id="lock-screen" class="lock-screen">
    <div class="lock-icon">🛑</div>
    <p class="sub" style="margin-bottom: 10px; color: #ff506e; font-weight: bold;">
      Доступ заблокирован!<br>
      Вы должны пройти через Lootlabs.
    </p>
    <a href="https://lootdest.org/s?BSEkyrKI" class="btn-lootlabs">Пройти проверку Lootlabs</a>
  </div>

  <p class="footer">Ключ меняется автоматически. Не делись им с другими.</p>
</div>

<script>
  // Список разрешенных сайтов, с которых можно переходить
  const ALLOWED_REFERRERS = [
    'lootlabs', 'loot-link', 'lootdest', 'loot-links'
  ];

  // Твоя ссылка на Lootlabs
  const LOOTLABS_URL = "https://lootdest.org/s?BSEkyrKI";

  async function init() {
    // Получаем URL, с которого пришел пользователь
    const referrer = document.referrer.toLowerCase();
    
    // Проверяем, есть ли разрешенный сайт в referrer
    const isFromLootlabs = ALLOWED_REFERRERS.some(domain => referrer.includes(domain));
    
    // Для отладки (если открываешь локально) - разрешаем доступ
    const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

    if (isFromLootlabs || isLocalhost) {
      // Если пришел откуда надо - показываем ключ
      document.getElementById('key-screen').style.display = 'block';
      await loadKey();
    } else {
      // Если зашел напрямую - показываем экран блокировки
      document.getElementById('lock-screen').style.display = 'flex';
      
      // Делаем так, чтобы кнопка вела на правильную ссылку
      document.querySelector('.btn-lootlabs').href = LOOTLABS_URL;
    }
  }

  async function loadKey() {
    try {
      // Загружаем ключ из скрытого файла raw.txt
      const res = await fetch('raw.txt?t=' + Date.now());
      if (!res.ok) throw new Error('Файл не найден');
      const key = await res.text();
      document.getElementById('key').innerText = key.trim();
    } catch (e) {
      document.getElementById('key').innerText = 'Ошибка загрузки ключа';
    }
  }

  function copyKey() {
    const text = document.getElementById('key').innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy');
      btn.innerText = '✓ Скопировано';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerText = '📋 Скопировать';
        btn.classList.remove('copied');
      }, 2000);
    });
  }

  // Запускаем проверку при загрузке
  init();
</script>
</body>
</html>
